<svg viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  
  <!-- Banner Top Header -->
  <text x="60" y="70" fill="#58A6FF" font-size="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900">FORGENEXA ECOSYSTEM</text>
  <text x="60" y="100" fill="#8B949E" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">High-Performance, Local-First Developer Tools Suite · Built with Go, React 19 &amp; TypeScript</text>

  <!-- 5 App Showcase Grid -->
  <!-- 1. Forge IDE -->
  <g transform="translate(60, 130)">
    <rect width="200" height="320" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect width="200" height="36" rx="10" fill="#21262D"/>
    <circle cx="20" cy="18" r="4" fill="#ED6A5E"/>
    <circle cx="32" cy="18" r="4" fill="#F4BF4F"/>
    <circle cx="44" cy="18" r="4" fill="#61C554"/>
    <text x="100" y="22" fill="#58A6FF" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Forge IDE</text>
    <text x="16" y="65" fill="#C9D1D9" font-size="11" font-family="monospace">package main</text>
    <text x="16" y="85" fill="#79C0FF" font-size="11" font-family="monospace">func Run() {</text>
    <text x="28" y="105" fill="#7EE787" font-size="11" font-family="monospace">  // Monaco</text>
    <text x="16" y="125" fill="#79C0FF" font-size="11" font-family="monospace">}</text>
    <rect x="12" y="150" width="176" height="150" rx="6" fill="#0D1117" stroke="#21262D"/>
    <text x="24" y="175" fill="#58A6FF" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">INTELLIJ BOTTOM PANEL</text>
    <text x="24" y="200" fill="#8B949E" font-size="10" font-family="monospace">$ go test ./...</text>
    <text x="24" y="220" fill="#7EE787" font-size="10" font-family="monospace">PASS: 16/16 flows</text>
    <text x="24" y="250" fill="#C9D1D9" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Daemon: Port 61033</text>
    <rect x="24" y="265" width="152" height="22" rx="4" fill="#238636"/>
    <text x="100" y="280" fill="#FFFFFF" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Open Editor</text>
  </g>

  <!-- 2. Forge API -->
  <g transform="translate(280, 130)">
    <rect width="200" height="320" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect width="200" height="36" rx="10" fill="#21262D"/>
    <circle cx="20" cy="18" r="4" fill="#ED6A5E"/>
    <circle cx="32" cy="18" r="4" fill="#F4BF4F"/>
    <circle cx="44" cy="18" r="4" fill="#61C554"/>
    <text x="100" y="22" fill="#7EE787" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Forge API</text>
    <rect x="12" y="50" width="40" height="18" rx="3" fill="#238636" fill-opacity="0.2"/>
    <text x="20" y="63" fill="#7EE787" font-size="9" font-family="monospace" font-weight="bold">POST</text>
    <text x="56" y="63" fill="#8B949E" font-size="9" font-family="monospace">/v1/stream</text>
    <rect x="12" y="80" width="176" height="50" rx="6" fill="#0D1117" stroke="#21262D"/>
    <text x="20" y="100" fill="#7EE787" font-size="9" font-family="monospace">200 OK (1.8ms)</text>
    <text x="20" y="118" fill="#79C0FF" font-size="9" font-family="monospace">DNS: 0.1ms TLS: 0.7ms</text>
    <rect x="12" y="140" width="176" height="160" rx="6" fill="#0D1117" stroke="#21262D"/>
    <text x="20" y="165" fill="#8B949E" font-size="9" font-family="monospace">{</text>
    <text x="28" y="185" fill="#79C0FF" font-size="9" font-family="monospace">"status": "ready",</text>
    <text x="28" y="205" fill="#79C0FF" font-size="9" font-family="monospace">"engine": "go",</text>
    <text x="28" y="225" fill="#79C0FF" font-size="9" font-family="monospace">"pool": 100</text>
    <text x="20" y="245" fill="#8B949E" font-size="9" font-family="monospace">}</text>
    <rect x="24" y="265" width="152" height="22" rx="4" fill="#238636"/>
    <text x="100" y="280" fill="#FFFFFF" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Test Endpoint</text>
  </g>

  <!-- 3. Forge Terminal -->
  <g transform="translate(500, 130)">
    <rect width="200" height="320" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect width="200" height="36" rx="10" fill="#21262D"/>
    <circle cx="20" cy="18" r="4" fill="#ED6A5E"/>
    <circle cx="32" cy="18" r="4" fill="#F4BF4F"/>
    <circle cx="44" cy="18" r="4" fill="#61C554"/>
    <text x="100" y="22" fill="#E3B341" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Forge Terminal</text>
    <rect x="12" y="50" width="176" height="100" rx="6" fill="#0A0C0E" stroke="#21262D"/>
    <text x="20" y="70" fill="#7EE787" font-size="9" font-family="monospace">$ zsh (PTY 1)</text>
    <text x="20" y="90" fill="#C9D1D9" font-size="9" font-family="monospace">tiocswinsz: 120x40</text>
    <text x="20" y="110" fill="#388BFD" font-size="9" font-family="monospace">creack/pty native</text>
    <rect x="12" y="160" width="176" height="90" rx="6" fill="#0A0C0E" stroke="#21262D"/>
    <text x="20" y="180" fill="#E3B341" font-size="9" font-family="monospace">top - PID 1042</text>
    <text x="20" y="200" fill="#7EE787" font-size="9" font-family="monospace">CPU: 0.4% MEM: 18M</text>
    <text x="20" y="220" fill="#8B949E" font-size="9" font-family="monospace">Zero Zombie Exit</text>
    <rect x="24" y="265" width="152" height="22" rx="4" fill="#D97706"/>
    <text x="100" y="280" fill="#FFFFFF" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Spawn Shell</text>
  </g>

  <!-- 4. Forge Git -->
  <g transform="translate(720, 130)">
    <rect width="200" height="320" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect width="200" height="36" rx="10" fill="#21262D"/>
    <circle cx="20" cy="18" r="4" fill="#ED6A5E"/>
    <circle cx="32" cy="18" r="4" fill="#F4BF4F"/>
    <circle cx="44" cy="18" r="4" fill="#61C554"/>
    <text x="100" y="22" fill="#D2A8FF" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Forge Git</text>
    <rect x="12" y="50" width="176" height="100" rx="6" fill="#0D1117" stroke="#21262D"/>
    <line x1="28" y1="65" x2="28" y2="135" stroke="#388BFD" stroke-width="2"/>
    <circle cx="28" cy="75" r="4" fill="#388BFD"/>
    <text x="40" y="78" fill="#C9D1D9" font-size="8" font-family="sans-serif">feat: ecosystem</text>
    <circle cx="28" cy="105" r="4" fill="#7EE787"/>
    <text x="40" y="108" fill="#C9D1D9" font-size="8" font-family="sans-serif">feat: go daemon</text>
    <rect x="12" y="160" width="176" height="90" rx="6" fill="#0D1117" stroke="#21262D"/>
    <text x="20" y="180" fill="#7EE787" font-size="9" font-family="monospace">+ func Diff() {</text>
    <text x="20" y="200" fill="#FF7B72" font-size="9" font-family="monospace">- // legacy</text>
    <text x="20" y="220" fill="#7EE787" font-size="9" font-family="monospace">+   topological()</text>
    <rect x="24" y="265" width="152" height="22" rx="4" fill="#8957E5"/>
    <text x="100" y="280" fill="#FFFFFF" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Visual Commit</text>
  </g>

  <!-- 5. Forge Hub -->
  <g transform="translate(940, 130)">
    <rect width="200" height="320" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect width="200" height="36" rx="10" fill="#21262D"/>
    <circle cx="20" cy="18" r="4" fill="#ED6A5E"/>
    <circle cx="32" cy="18" r="4" fill="#F4BF4F"/>
    <circle cx="44" cy="18" r="4" fill="#61C554"/>
    <text x="100" y="22" fill="#58A6FF" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Forge Hub</text>
    <rect x="12" y="50" width="176" height="200" rx="6" fill="#0D1117" stroke="#21262D"/>
    <text x="20" y="75" fill="#58A6FF" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">DISCOVERY SUPERVISOR</text>
    <text x="20" y="100" fill="#7EE787" font-size="9" font-family="sans-serif">● Forge IDE (Active)</text>
    <text x="20" y="125" fill="#7EE787" font-size="9" font-family="sans-serif">● Forge API (Ready)</text>
    <text x="20" y="150" fill="#7EE787" font-size="9" font-family="sans-serif">● Forge Terminal (Ready)</text>
    <text x="20" y="175" fill="#7EE787" font-size="9" font-family="sans-serif">● Forge Git (Ready)</text>
    <text x="20" y="200" fill="#7EE787" font-size="9" font-family="sans-serif">● Forge Core (v1.0.0)</text>
    <rect x="24" y="265" width="152" height="22" rx="4" fill="#1F6FEB"/>
    <text x="100" y="280" fill="#FFFFFF" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Launch Hub</text>
  </g>
</svg>
