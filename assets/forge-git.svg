<svg viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" rx="12" fill="#0F1115" stroke="#242933" stroke-width="2"/>
  <path d="M0 12C0 5.37258 5.37258 0 12 0H788C794.627 0 800 5.37258 800 12V36H0V12Z" fill="#161920"/>
  <circle cx="20" cy="18" r="5" fill="#ED6A5E"/>
  <circle cx="36" cy="18" r="5" fill="#F4BF4F"/>
  <circle cx="52" cy="18" r="5" fill="#61C554"/>
  <text x="400" y="22" fill="#8B949E" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">forge-git — Visual Topological DAG &amp; Diff Inspector — ForgeNexa</text>

  <!-- Left: Topological Commit Graph DAG -->
  <rect x="16" y="50" width="360" height="414" rx="8" fill="#12151B" stroke="#1E222B" stroke-width="1"/>
  <rect x="16" y="50" width="360" height="30" rx="8" fill="#1B1F27"/>
  <text x="32" y="70" fill="#8B949E" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">TOPOLOGICAL COMMIT GRAPH (DAG)</text>

  <!-- DAG Nodes & Branches -->
  <line x1="40" y1="100" x2="40" y2="400" stroke="#388BFD" stroke-width="2"/>
  <line x1="40" y1="140" x2="70" y2="180" stroke="#7EE787" stroke-width="2"/>
  <line x1="70" y1="180" x2="70" y2="300" stroke="#7EE787" stroke-width="2"/>
  <line x1="70" y1="300" x2="40" y2="340" stroke="#7EE787" stroke-width="2"/>

  <!-- Commits -->
  <circle cx="40" cy="100" r="7" fill="#388BFD"/>
  <text x="60" y="104" fill="#C9D1D9" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">feat: release v1.0.0 ecosystem</text>
  <text x="300" y="104" fill="#8B949E" font-size="10" font-family="monospace">cf938eb</text>

  <circle cx="70" cy="200" r="6" fill="#7EE787"/>
  <text x="88" y="204" fill="#C9D1D9" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">feat(lsp): 22-language AST indexing</text>
  <text x="300" y="204" fill="#8B949E" font-size="10" font-family="monospace">9e4cf08</text>

  <circle cx="70" cy="260" r="6" fill="#7EE787"/>
  <text x="88" y="264" fill="#C9D1D9" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">feat(git): native Go git parser</text>
  <text x="300" y="264" fill="#8B949E" font-size="10" font-family="monospace">cddd534</text>

  <circle cx="40" cy="340" r="7" fill="#388BFD"/>
  <text x="60" y="344" fill="#C9D1D9" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">merge branch 'feat/backend-go'</text>
  <text x="300" y="344" fill="#8B949E" font-size="10" font-family="monospace">45a26bf</text>

  <!-- Right: Diff & Staging Panel -->
  <rect x="390" y="50" width="394" height="414" rx="8" fill="#12151B" stroke="#1E222B" stroke-width="1"/>
  <rect x="390" y="50" width="394" height="30" rx="8" fill="#1B1F27"/>
  <text x="406" y="70" fill="#C9D1D9" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Diff: services/forge-daemon/pkg/git/git.go</text>
  
  <text x="406" y="106" fill="#484F58" font-size="11" font-family="monospace">@@ -14,6 +14,8 @@</text>
  <rect x="396" y="116" width="382" height="20" fill="#238636" fill-opacity="0.15"/>
  <text x="406" y="130" fill="#7EE787" font-size="11" font-family="monospace">+ func (m *Manager) GetStatus() (*GitStatus, error) {</text>
  <rect x="396" y="136" width="382" height="20" fill="#238636" fill-opacity="0.15"/>
  <text x="406" y="150" fill="#7EE787" font-size="11" font-family="monospace">+   m.mu.Lock(); defer m.mu.Unlock()</text>
  <text x="406" y="170" fill="#C9D1D9" font-size="11" font-family="monospace">    cmd := exec.Command("git", "status", "--porcelain")</text>
  <text x="406" y="190" fill="#C9D1D9" font-size="11" font-family="monospace">    out, err := cmd.Output()</text>
  <text x="406" y="210" fill="#C9D1D9" font-size="11" font-family="monospace">    return parsePorcelain(out), err</text>
  <rect x="396" y="218" width="382" height="20" fill="#238636" fill-opacity="0.15"/>
  <text x="406" y="232" fill="#7EE787" font-size="11" font-family="monospace">+ }</text>

  <!-- Staging Action Toolbar -->
  <rect x="396" y="380" width="382" height="70" rx="6" fill="#161920" stroke="#21262D" stroke-width="1"/>
  <rect x="410" y="400" width="100" height="30" rx="4" fill="#238636"/>
  <text x="432" y="420" fill="#FFFFFF" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Stage All</text>
  <rect x="520" y="400" width="100" height="30" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
  <text x="546" y="420" fill="#C9D1D9" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Discard</text>
  <rect x="630" y="400" width="134" height="30" rx="4" fill="#388BFD"/>
  <text x="652" y="420" fill="#FFFFFF" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Commit &amp; Push</text>
</svg>
